name: host-id-focused-check

on:
  push:
    branches:
      - review/host-id-address-generation

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: zephyr
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a # v1.0.15
        with:
          app-path: zephyr
          toolchains: arm-zephyr-eabi:riscv64-zephyr-elf

      - name: Run host identity tests
        working-directory: zephyr
        shell: bash
        run: >-
          west twister
          -T tests/bluetooth/host_id
          -p native_sim
          -p native_sim/native/64
          --inline-logs
          -v
